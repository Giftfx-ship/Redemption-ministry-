<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Redemption Ministries Warri</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
        }
        
        .contact-info {
            background: var(--card);
            border-radius: 15px;
            padding: 40px;
            border: 1px solid var(--border);
        }
        
        .contact-info h2 {
            margin-bottom: 30px;
        }
        
        .info-item {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .info-icon {
            width: 50px;
            height: 50px;
            background: rgba(201,162,39,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        
        .info-text h4 {
            font-size: 1rem;
            margin-bottom: 5px;
        }
        
        .info-text p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        
        .contact-form {
            background: var(--card);
            border-radius: 15px;
            padding: 40px;
            border: 1px solid var(--border);
        }
        
        .contact-form h2 {
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: var(--text-muted);
        }
